.sec{padding:56px 6vw;background:#fff}.sec h2{font-size:30px;color:var(--navy);margin-bottom:6px}.fi{font-size:26px;width:48px;height:48px;border-radius:14px;background:var(--soft);display:grid;place-items:center;margin-bottom:10px}
.band{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:40px 6vw;display:flex;gap:30px;justify-content:space-around;flex-wrap:wrap;text-align:center}.band b{font-size:34px;display:block}
.lgn{min-height:100%;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#0B1F4B,#12306E)}label{font-size:12px;font-weight:600;display:block;margin:10px 0 4px}
